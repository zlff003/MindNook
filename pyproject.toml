[project]
name = "mindnook"
version = "0.1.0"
description = "MindNook campus mental-health support MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.28,<1.0",
    "pymysql>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "redis>=5.2,<6.0",
    "chromadb>=0.5.23,<2.0",
    "fastembed>=0.7,<1.0",
    "mcp>=1.27,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
